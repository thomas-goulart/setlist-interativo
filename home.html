<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setlist Interativo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 600px; margin: auto; text-align: center; }
        h1 { color: #1db954; font-size: 2.2rem; margin-bottom: 10px; }
        p { color: #aaa; font-size: 1.1rem; line-height: 1.5; margin-bottom: 25px; }
        .icone { font-size: 4rem; margin-bottom: 15px; display: block; }
        .card-mensagem { background: #1e1e1e; border: 1px solid #333; padding: 40px 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .rodape-discreto { text-align: center; font-size: 0.85rem; }
        .rodape-discreto a { color: #1db954; text-decoration: none; font-weight: bold; transition: color 0.2s; }
        .rodape-discreto a:hover { color: #1ed760; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-mensagem">
            <span class="icone">🎸</span>
            <h1>Setlist Interativo</h1>
            <p>Plataforma de interatividade ao vivo entre artistas e público. O show ainda não começou ou você está na página principal do sistema.</p>
        </div>
    </div>

    <div class="rodape-discreto">
        <a href="fila.html">Acessar Painel do Artista</a>
    </div>
</body>
</html>
